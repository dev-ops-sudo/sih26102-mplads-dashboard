[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mplads-intelligence-api"
version = "1.0.0"
description = "Backend services for the SIH26102 MPLADS Intelligence dashboard"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",
  "openai>=1.51,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

